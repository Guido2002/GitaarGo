name: gitaargo
description: "Speel. Leer. Groei. Offline gitaarleren met echte audiofeedback."
publish_to: 'none'

version: 0.2.0+3

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^3.4.3
  go_router: ^18.1.1
  record: ^7.1.2
  flame: ^1.38.2
  drift: ^2.35.3
  sqlite3: ^3.8.0
  path_provider: ^2.1.6
  path: ^1.9.1
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^2.0.0
  open_filex: ^5.0.0
  package_info_plus: ^10.2.2
  crypto: ^3.0.8
  pub_semver: ^2.2.1
  http: ^1.6.0

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
  uses-material-design: true
  assets:
    - assets/exercises/library.json
    - assets/fonts/OFL.txt
